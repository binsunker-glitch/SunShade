    <!-- منع الوميض الأبيض وقفزة الصفحة أثناء التحميل -->
    <style>
      html { background: #0F1F2E; }
      body {
        margin: 0;
        background: #0F1F2E;
        color: #fff;
        font-family: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
      }
      #root { min-height: 100vh; }
      .boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
      }
      .boot svg { width: 64px; height: 64px; }
      .boot p { margin: 0; color: #C8A96A; font-size: 18px; font-weight: 600; }
      .boot i {
        width: 120px; height: 3px; border-radius: 3px; background: #1d3347; overflow: hidden; position: relative;
      }
      .boot i::after {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #C8A96A;
        animation: boot 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .boot i::after { animation: none; } }
    </style>
