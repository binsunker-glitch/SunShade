<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1F2E" />
  <title>لا يوجد اتصال — ظل سيارتي</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0F1F2E; color: #fff;
      font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
      padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    }
    .card { text-align: center; max-width: 380px; }
    svg { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; line-height: 2; color: rgba(255,255,255,.75); margin: 0 0 20px; }
    .row { display: flex; gap: 10px; justify-content: center; }
    a, button {
      border: 0; border-radius: 10px; padding: 12px 22px;
      font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none;
      font-family: inherit;
    }
    .go { background: #C8A96A; color: #0F1F2E; }
    .retry { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M20 62 Q50 18 80 62" stroke="#C8A96A" stroke-width="8" fill="none" stroke-linecap="round"/>
      <rect x="22" y="66" width="56" height="8" rx="4" fill="#C8A96A"/>
    </svg>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>بعض المحتوى متاح من الذاكرة. تحقق من الاتصال ثم حاول مجدداً.</p>
    <div class="row">
      <a class="go" href="/SunShade/">الرئيسية</a>
      <button class="retry" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </div>
</body>
</html>
